[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-status-report"
version = "0.2.0"
description = "Deterministic validator and DOCX renderer for four-page project status reports."
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.2.0"
]

[project.scripts]
project-status-report = "project_status_report.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
