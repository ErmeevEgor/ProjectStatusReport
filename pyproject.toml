[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-status-report"
version = "0.9.0"
description = "Project status report skill and legacy validation utilities; canonical workflow is Web LLM + Google Drive + Confluence Storage Format."
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.2.0"
]

[project.scripts]
project-status-report = "project_status_report.cli:main"
project-status-report-confluence = "project_status_report.confluence:main"
project-status-report-sources = "project_status_report.state:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
