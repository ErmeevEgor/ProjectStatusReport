interface:
  display_name: "Отчет о состоянии проекта"
  short_description: "Собирает 4-страничный ОСП из договоров, чатов и проектных данных"
  default_prompt: "Используй $project-status-report, чтобы собрать актуальный ОСП: сформируй страницу 2 из договорного baseline, отдели operational backlog, выполни risk coverage pass по просрочкам, блокерам и открытым вопросам, затем рассчитай прогресс и сформируй чистый и рабочий DOCX."
