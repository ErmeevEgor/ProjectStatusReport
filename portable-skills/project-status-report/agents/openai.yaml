interface:
  display_name: "Отчет о состоянии проекта"
  short_description: "Собирает 4-страничный ОСП из договоров, чатов и проектных данных"
  default_prompt: "Используй $project-status-report, чтобы собрать актуальный ОСП по текущему проекту: сначала проверь наличие предыдущего ОСП, затем учти договор, ДС, проектный контекст и переписку, рассчитай прогресс по стоимости и сформируй чистый и рабочий DOCX."
