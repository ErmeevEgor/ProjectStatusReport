name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - run: python -m project_status_report.cli examples/sample-report-data.json --out output --name sample
      - run: python scripts/build_portable_skill.py
